name: Native Windows security boundaries
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  acl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.3'
          cache: false
      - name: Exercise real Windows security descriptors and reparse points
        working-directory: native
        run: go test -count=1 -v ./internal/windowstrust
      - name: Vet Windows security implementation
        working-directory: native
        run: go vet ./internal/windowstrust
