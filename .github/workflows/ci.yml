name: Ability host contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install checksum-pinned Kujo
        shell: bash
        run: |
          mkdir -p .local/runtime
          curl --fail --location --silent --show-error https://github.com/kujolang/kujo/releases/download/v1.7.0/kujo-v1.7.0-linux-x64.tar.gz -o .local/runtime/kujo.tar.gz
          echo '526729faff88d19f985cd471ab8602a87070a539ceff7984e12352e30a229c4a  .local/runtime/kujo.tar.gz' | sha256sum --check
          tar -xzf .local/runtime/kujo.tar.gz -C .local/runtime
          runtime_path=$(find "$PWD/.local/runtime" -type f -name kujo -perm /111 | head -1)
          test -n "$runtime_path"
          echo "KUJO_BIN=$runtime_path" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Clean local installation with bundled runtime
        run: npm run test:setup
      - name: Canonical MCP pack integration
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/kujolang/mcp.git ../mcp
          git -C ../mcp checkout a7ec0dd8e6bcae303ab1431b4586dfe3e91f3a5a
          npm run test:integration
      - name: Canonical change review over MCP
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/kujolang/patchbrief.git ../patchbrief
          git -C ../patchbrief checkout 0e8d6bd6fd226b09b807f8758ade08096c8b70f0
          git clone --filter=blob:none https://github.com/kujolang/changebucket.git ../changebucket
          git -C ../changebucket checkout 030eea63c60449f82c9ba2680227485d318fdb6d
          npm run test:review
          git clone --filter=blob:none https://github.com/kujolang/shipcheck.git ../shipcheck
          git -C ../shipcheck checkout 0a9f5795e9498f3698d5da6bb66642544251dd37
          KUJO_REVIEW_RELEASE=1 npm run test:review
      - run: npm run package
      - name: Verify reproducible package
        shell: bash
        run: |
          cp dist/SHA256SUMS .local/first-checksums
          npm run package
          cmp .local/first-checksums dist/SHA256SUMS

  installed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install packed distribution and execute canonical tools
        run: npm run test:install

  receipt-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify durable receipt storage independently of the runtime
        run: node --test tests/receipt-storage.test.mjs tests/sqlite-receipts.test.mjs

  preinstalled-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify embedded canonical source integrity
        run: python3 scripts/native-assets.py --verify
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.3'
          cache: false
      - name: Prepare checksum-pinned native runtime for acceptance
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) kujo_asset=linux-x64; kujo_sha=526729faff88d19f985cd471ab8602a87070a539ceff7984e12352e30a229c4a ;;
            Linux/ARM64) kujo_asset=linux-arm64; kujo_sha=cbc063076f32d426df9ddf1fb40e078c7094d11f10fafe1d2b01bbe70bd8edfa ;;
            macOS/X64) kujo_asset=macos-x64; kujo_sha=9ddf267ebb1fa043713410c15c60edbf1fbfe128068aac1aeb5c6c0562a88ddc ;;
            macOS/ARM64) kujo_asset=macos-arm64; kujo_sha=81c4d5431bcaba51bd991bbe3e0747c5d8579bec16d3aef5b27d01bc8fc91c9c ;;
            *) exit 1 ;;
          esac
          kujo_archive="$RUNNER_TEMP/kujo-native.tar.gz"
          curl --fail --location --silent --show-error "https://github.com/kujolang/kujo/releases/download/v1.7.0/kujo-v1.7.0-$kujo_asset.tar.gz" -o "$kujo_archive"
          echo "$kujo_sha  $kujo_archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/kujo-native"
          tar -xzf "$kujo_archive" -C "$RUNNER_TEMP/kujo-native"
          kujo_native_path=$(find "$RUNNER_TEMP/kujo-native" -type f -name kujo -perm -100 | head -1)
          test -n "$kujo_native_path"
          echo "KUJO_NATIVE_TEST_BIN=$kujo_native_path" >> "$GITHUB_ENV"
      - name: Build native adapter (no runtime download by the adapter)
        working-directory: native
        run: |
          mkdir -p ../dist
          go build -trimpath -o ../dist/kujo-openai-native ./preflight
      - name: Native protocol and canonical acceptance with Node/Git absent from child PATH
        shell: bash
        run: |
          export KUJO_NATIVE_HOST_BIN="$PWD/dist/kujo-openai-native"
          cd native
          go test -race -count=1 ./...
      - name: Vet native diagnostic
        working-directory: native
        run: go vet ./...
