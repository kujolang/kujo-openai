name: Native dependency vulnerability audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install pinned maintainer-only vulnerability checker
        run: GOBIN="$RUNNER_TEMP/kujo-security-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Build with the current native toolchain and target
        working-directory: native
        env:
          # Keep the audited compiler identical to the packaged native adapter.
          GOTOOLCHAIN: go1.26.8
          GOOS: ${{ matrix.target }}
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/kujo-native-audit" ./preflight
      - name: Scan compiled adapter including platform-specific dependencies
        run: '"$RUNNER_TEMP/kujo-security-tools/govulncheck" -mode=binary "$RUNNER_TEMP/kujo-native-audit"'
